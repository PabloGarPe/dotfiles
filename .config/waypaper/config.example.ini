# Plantilla de waypaper. install.sh la copia a config.ini si no existe;
# config.ini no va en el repo porque guarda el fondo elegido en cada equipo.
[Settings]
language = en
folder = ~/Pictures/Wallpapers
monitors = All
backend = mpvpaper
fill = fill
sort = name
color = #000000
subfolders = False
mpvpaper_sound = False
mpvpaper_options = hwdec=auto
# Al cambiar de fondo, genera los colores del sistema con matugen
post_command = ~/.config/matugen/from-wallpaper.sh $wallpaper
