# Generado por matugen a partir del wallpaper. No editar a mano.
[urgency_low]
    background = "{{colors.surface_container.default.hex}}DB"
    foreground = "{{colors.on_surface_variant.default.hex}}"
    frame_color = "{{colors.outline_variant.default.hex}}80"
    highlight = "{{colors.primary.default.hex}}"

[urgency_normal]
    background = "{{colors.surface_container.default.hex}}E3"
    foreground = "{{colors.on_surface.default.hex}}"
    frame_color = "{{colors.outline_variant.default.hex}}99"
    highlight = "{{colors.primary.default.hex}}, {{colors.tertiary.default.hex}}"

[urgency_critical]
    background = "{{colors.surface_container_high.default.hex}}F0"
    foreground = "{{colors.on_surface.default.hex}}"
    frame_color = "{{colors.error.default.hex}}"
    format = "<b><span foreground='{{colors.error.default.hex}}'>%s</span></b>\n<span alpha='80%'>%b</span>"
    highlight = "{{colors.error.default.hex}}"
