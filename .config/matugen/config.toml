# matugen: genera los colores del sistema a partir del wallpaper.
# Lo lanza ~/.config/matugen/from-wallpaper.sh (post_command de waypaper); plantillas en templates/.

[config]

[templates.hyprland]
input_path  = '~/.config/matugen/templates/hyprland.lua'
output_path = '~/.config/hypr/conf/colors.lua'
post_hook   = 'hyprctl reload >/dev/null'

[templates.waybar]
input_path  = '~/.config/matugen/templates/waybar.css'
output_path = '~/.config/waybar/colors.css'
# Sin post_hook: el tema macOS de waybar no usa colors.css, y recargar waybar con SIGUSR2 lo cuelga (0.15)

[templates.rofi]
input_path  = '~/.config/matugen/templates/rofi.rasi'
output_path = '~/.config/rofi/colors/matugen.rasi'

[templates.gtk3]
input_path  = '~/.config/matugen/templates/gtk.css'
output_path = '~/.config/gtk-3.0/gtk.css'

[templates.gtk4]
input_path  = '~/.config/matugen/templates/gtk.css'
output_path = '~/.config/gtk-4.0/gtk.css'

[templates.kde]
input_path  = '~/.config/matugen/templates/kdeglobals'
output_path = '~/.config/kdeglobals'

# Mismo esquema como archivo .colors, para qt6ct-kde (todas las apps Qt)
[templates.kde-colors]
input_path  = '~/.config/matugen/templates/kdeglobals'
output_path = '~/.local/share/color-schemes/Matugen.colors'

# Color principal en texto plano (lo usa papirus-matugen.py para las carpetas)
[templates.primary]
input_path  = '~/.config/matugen/templates/primary.txt'
output_path = '~/.cache/matugen/primary'

# Centro de control de Quickshell (se recarga solo al cambiar el fichero)
[templates.quickshell]
input_path  = '~/.config/matugen/templates/quickshell.qml'
output_path = '~/.config/quickshell/Matugen.qml'

# fastfetch al abrir una terminal (avatar + datos del sistema con el acento del wallpaper)
[templates.fastfetch]
input_path  = '~/.config/matugen/templates/fastfetch.jsonc'
output_path = '~/.config/fastfetch/config.jsonc'

# Notificaciones (dunst): colores en un drop-in, el resto del estilo en ~/.config/dunst/dunstrc
[templates.dunst]
input_path  = '~/.config/matugen/templates/dunst.conf'
output_path = '~/.config/dunst/dunstrc.d/50-matugen.conf'
post_hook   = 'dunstctl reload >/dev/null 2>&1'

# kitty: colores en un include; SIGUSR1 recarga la config de las kitty abiertas
[templates.kitty]
input_path  = '~/.config/matugen/templates/kitty.conf'
output_path = '~/.config/kitty/matugen.conf'
post_hook   = 'pkill -USR1 -x kitty || true'
