# Transparencia del fondo (se multiplica con la opacidad de Hyprland)
background_opacity 0.92
# Permite ajustarla en caliente: ctrl+shift+a y luego m (más) / l (menos)
dynamic_background_opacity yes

# Fuente con iconos Nerd Font (fastfetch, Powerlevel10k, nvim) a tamaño completo
font_family      JetBrainsMono Nerd Font Mono
bold_font        auto
italic_font      auto
bold_italic_font auto
font_size        11.0

# Colores del wallpaper (generado por matugen, plantilla en ~/.config/matugen/templates/kitty.conf)
include matugen.conf
