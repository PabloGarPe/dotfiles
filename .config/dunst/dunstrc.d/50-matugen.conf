# Generado por matugen a partir del wallpaper. No editar a mano.
[urgency_low]
    background = "#271d1cC7"
    foreground = "#d8c2bf"
    frame_color = "#53434180"
    highlight = "#ffb4ac"

[urgency_normal]
    background = "#271d1cD1"
    foreground = "#f1dedc"
    frame_color = "#53434199"
    highlight = "#ffb4ac, #e0c38c"

[urgency_critical]
    background = "#322826E6"
    foreground = "#f1dedc"
    frame_color = "#ffb4ab"
    format = "<b><span foreground='#ffb4ab'>%s</span></b>\n<span alpha='80%'>%b</span>"
    highlight = "#ffb4ab"
