# Generado por matugen a partir del wallpaper. No editar a mano.
[urgency_low]
    background = "#1b2023DB"
    foreground = "#c0c8cc"
    frame_color = "#40484c80"
    highlight = "#89d0ed"

[urgency_normal]
    background = "#1b2023E3"
    foreground = "#dee3e6"
    frame_color = "#40484c99"
    highlight = "#89d0ed, #c4c3eb"

[urgency_critical]
    background = "#252b2dF0"
    foreground = "#dee3e6"
    frame_color = "#ffb4ab"
    format = "<b><span foreground='#ffb4ab'>%s</span></b>\n<span alpha='80%'>%b</span>"
    highlight = "#ffb4ab"
