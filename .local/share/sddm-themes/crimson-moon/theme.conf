[General]
# Vídeo de fondo (relativo al tema o ruta absoluta legible por el usuario sddm).
# Déjalo vacío para usar solo la imagen.
Video=assets/background.mp4
Background=assets/background.jpg

Accent=#ff2a3d
AccentSoft=#ff6b78
# Tono oscuro del cristal y menús
Tint=#140709

# Avatar (relativo al tema o ruta absoluta). Vacío = el de SDDM / inicial.
Avatar=assets/avatar.png
Font=Inter

# Formato del reloj (Qt): "HH:mm" o "h:mm AP"
ClockFormat=HH:mm
DateFormat="dddd, d 'de' MMMM"

# Oscurecimiento sobre el fondo (0.0 - 1.0)
Dim=0.25
